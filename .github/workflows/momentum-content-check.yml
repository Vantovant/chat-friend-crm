name: Momentum content checks
on:
  pull_request:
    paths:
      - 'src/lib/mcp/**'
      - 'supabase/**'
      - '.github/workflows/momentum-content-check.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
